[project]
name = "slomo-backend"
version = "0.1.0"
description = "SloMo — Virtual Pet & Command Center for Jetson Orion Nano (FastAPI backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psutil>=6.0",
    "ptyprocess>=0.7",
    "httpx>=0.27",
    "structlog>=24.1",
    "langgraph>=0.2.60",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langfuse>=2.50,<3",
]

[project.optional-dependencies]
# Graph + vector memory (Kùzu / Chroma). The backend degrades gracefully to an
# in-memory store when these are absent, so dev machines can skip them.
memory = ["kuzu>=0.6", "chromadb>=0.5"]
# Jetson-only telemetry (jtop). Falls back to psutil elsewhere.
jetson = ["jetson-stats>=4.2"]
voice = ["google-genai>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
