services:
  backend:
    build: ./backend
    network_mode: host   # LAN-only service; also lets the PTY reach host claude via mount
    environment:
      SLOMO_WORKSPACE_DIR: /workspace
      SLOMO_DATA_DIR: /data
      SLOMO_LOG_DIR: /logs
    env_file:
      - ./backend/.env
    volumes:
      - ${HOME}/workspace:/workspace:rw
      - ${HOME}/.slomo/db:/data:rw
      - ${HOME}/.slomo/logs:/logs:rw
      # claude CLI + credentials from the host (BRD: host claude, backend spawns PTYs)
      - /usr/local/bin/claude:/usr/local/bin/claude:ro
      - ${HOME}/.claude:/root/.claude:rw
    restart: unless-stopped

  frontend:
    build: ./frontend
    network_mode: host
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped

  # Optional self-hosted Langfuse (keeps traces on the LAN).
  # Minimal single-node setup; see https://langfuse.com/self-hosting for prod.
  langfuse:
    image: langfuse/langfuse:2
    profiles: ["observability"]
    depends_on: [langfuse-db]
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@localhost:5433/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: change-me-langfuse-secret
      SALT: change-me-langfuse-salt
    restart: unless-stopped

  langfuse-db:
    image: postgres:16-alpine
    profiles: ["observability"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    command: -p 5433
    ports:
      - "5433:5433"
    volumes:
      - langfuse-pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  langfuse-pg:
