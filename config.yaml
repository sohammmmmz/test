# ------------------------------------------------------------------ #
# Multi-camera person tracking POC config
# ------------------------------------------------------------------ #
device: cuda:0
fps: 15            # common timeline fps used to align the 3 synced videos

detector:
  weights: yolo26x.pt   # latest (Sept 2025), NMS-free end-to-end -> cleaner boxes
                        # for the tracker. Use yolo26l.pt to trade accuracy/speed.
  conf: 0.30            # lower => fewer missed people (fewer ID drops), more FPs
  iou: 0.50            # ignored by YOLO26 (NMS-free); kept for older-model fallback
  imgsz: 1280          # higher res helps small/distant people. try 1536 on 5090.
  half: true           # FP16 on Blackwell

tracker:
  type: botsort        # botsort | boosttrack | deepocsort  (all appearance-aware)
  reid_weights: osnet_ain_x1_0_msmt17.pt   # OSNet-AIN: adaptive instance norm,
                                           # built for cross-camera generalization
                                           # (vendored in repo; bigger margin than
                                           #  plain osnet for same-person-across-cams)
  half: true
  # --- knobs that directly reduce in-stream ID switching ---
  track_buffer: 90         # frames a lost track survives before deletion (6s @15fps)
  track_high_thresh: 0.50
  track_low_thresh: 0.10   # ByteTrack-style: recover low-confidence detections
  new_track_thresh: 0.60   # higher => slower to spawn a new id (avoids fragmenting)
  match_thresh: 0.80

reid:
  weights: osnet_ain_x1_0_msmt17.pt   # SAME model as tracker; used for global fusion
  half: true

fusion:
  use_geometry: false     # FALSE = match purely on appearance (no homography).
                          # Keep false until calibration is verified good, then set
                          # true to let floor position break ties between look-alikes.
  sim_threshold: 0.45     # min cosine similarity to call two crops the same person.
                          # Use reid_tuner.py to pick this for YOUR footage.
  geo_weight: 0.3         # how hard geometry nudges the cost (only when use_geometry)
  max_floor_dist_m: 1.0   # METERS: how close two detections must be to be the same
                          # person. Converted to floor-plan px via floor_px_per_meter.
  w_appearance: 0.6       # (legacy weight, kept for compatibility)
  gallery_size: 50        # embeddings kept per global identity
  max_age: 5.0            # seconds before an unseen global id is retired
  min_hits: 3             # confirmations before a person is counted

floor_plan: floorplan.png
floor_scale: 1.0          # multiply floor-plan coords by this when drawing the map
# Measured from floorplan.png: floor is 9.834 m x 8.83 m and spans ~1136 x 1020 px,
# i.e. ~115.5 px/m. (The drawing's nominal "1 px = 0.01 m" is the design scale, but
# the exported PNG is rendered larger, so we use the measured value here.)
floor_px_per_meter: 115.5

# sync_videos.py exported pre-aligned clips into synced/, so we read those
# directly and do NOT re-apply offsets (leave this empty). Point back at
# data/ + configs/sync_offsets.json instead if you'd rather offset at runtime.
sync_offsets: ""

cameras:
  - name: cam2
    video: synced/cam2.mp4
    homography: configs/H_cam2.npy
    start_frame: 0
  - name: cam3
    video: synced/cam3.mp4
    homography: configs/H_cam3.npy
    start_frame: 0
